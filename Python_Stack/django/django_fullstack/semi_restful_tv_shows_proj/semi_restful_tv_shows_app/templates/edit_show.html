<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Show</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <a href="/shows">Go Back</a>
    <h2>Edit Show {{show.id}}</h2>
    {% if messages %}  
    {% for message in messages %}  
        <p class="{{ message.tags }}">{{ message }}</p>
    {% endfor %}
    {% endif %}
    <form action="/shows/{{show.id}}/update/" method="POST">
        {% csrf_token %}
        
        <p>
            <label for="title">Title</label>
            <input type="text" name="title" id="title" value="{{show.title}}" required>
        </p>

        <p>
            <label for="network">Network</label>
            <input type="text" name="network" id="network" value="{{show.network}}" required>
        </p>

        <p>
            <label for="release_date">Release Date</label>
            <input type="date" name="release_date" id="release_date" value="{{show.release_date|date:'Y-m-d'}}" required>
        </p>

        <p>
            <label for="description">Description</label>
            <textarea name="description" id="description">{{show.description}}</textarea>
        </p>

        <input type="submit" value="Update">
    </form>
</body>
</html>
