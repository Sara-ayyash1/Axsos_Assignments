<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Read All Shows</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <h2>All Shows</h2>
     <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Network</th>
                <th>Release Date</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody>
            {%for show in all_shows%}
               <tr>
                <td>{{ show.id }}</td>
                <td>{{ show.title }}</td>
                <td>{{ show.network }}</td>
                <td>{{ show.release_date }}</td>
                <td>
                    <a href="/shows/{{ show.id }}/">Show</a> | 
                    <a href="/shows/{{ show.id }}/edit/">Edit</a> |
                    <a href="/shows/{{ show.id }}/destroy/">Delete</a>
                </td>
               </tr>
              {% empty %}
                <tr>
                    <td colspan="5" style="text-align: center; color: gray;">
                        No TV Shows available. Click "Add a New Show" to create one!
                    </td>
                </tr>
            {%endfor%}
        </tbody>
     </table>

     <a href="/shows/new/" >Add a New Show</a>
</body>
</html>
