<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create a New Show</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <a href="/shows">Go Back</a>
    <h2>Add a New Show</h2>
    
    <form action="/shows/create/" method="POST">
        {% csrf_token %}
        
        <p>
            <label for="title">Title</label><br>
            <input type="text" name="title" id="title" required>
        </p>

        <p>
            <label for="network">Network</label><br>
            <input type="text" name="network" id="network" required>
        </p>

        <p>
            <label for="release_date">Release Date</label><br>
            <input type="date" name="release_date" id="release_date" required>
        </p>

        <p>
            <label for="description">Description</label><br>
            <textarea name="description" id="description" rows="4" cols="30"></textarea>
        </p>

        <p>
            <input type="submit" value="Create">
        </p>
    </form>
</body>
</html>
