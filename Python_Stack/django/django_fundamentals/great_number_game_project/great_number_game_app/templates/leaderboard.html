<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Leaderboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">
  <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-10 w-full max-w-md text-center">
    <h1 class="text-2xl font-semibold text-gray-800 mb-6"> Leaderboard</h1>
    
    <table class="w-full text-left border-collapse mb-6">
      <thead>
        <tr class="border-b border-gray-100 text-gray-400 text-sm">
          <th class="pb-2">Name</th>
          <th class="pb-2 text-right">Attempts</th>
        </tr>
      </thead>
      <tbody>
        {% for winner in winners %}
        <tr class="border-b border-gray-50 text-gray-700 text-sm">
          <td class="py-3 font-medium">{{ winner.name }}</td>
          <td class="py-3 text-right text-gray-500">{{ winner.attempts }}</td>
        </tr>
        {% empty %}
        <tr>
          <td colspan="2" class="py-4 text-gray-400 text-sm">No winners yet. Be the first!</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
    
    <a href="/" class="text-sm font-medium text-gray-600 hover:text-gray-900 underline">Play Again</a>
  </div>
</body>
</html>
